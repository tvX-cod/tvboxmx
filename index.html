<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descarga de Aplicaciones</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #24292e;
            margin-bottom: 20px;
        }
        .btn-descarga {
            display: block;
            color: white;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            margin: 15px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s, transform 0.1s;
        }
        .pkg { background-color: #007bff; }
        .pkg:hover { background-color: #0056b3; }
        
        .apk { background-color: #28a745; }
        .apk:hover { background-color: #218838; }

        .btn-descarga:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Descarga nuestra App</h1>
        
        <!-- Botón para Mac/Instalador .pkg -->
        <a href="https://github.com/tvX-cod/tvboxmx/releases/download/v1.01/NF4.35.0.apk" download class="btn-descarga pkg">
            Descargar para Mac (.pkg)
        </a>

        <!-- Botón para Android .apk -->
        <a href="https://github.com/tvX-cod/tvboxmx/releases/download/v1.01/NF4.35.0.apk" download class="btn-descarga apk">
            Descargar para Android (.apk)
        </a>
    </div>

</body>
</html>
